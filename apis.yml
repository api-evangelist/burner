aid: burner
name: Burner
description: >-
  Burner is the original second-phone-number app from Ad Hoc Labs (founded 2012,
  Los Angeles), letting people create multiple temporary or permanent phone numbers
  on a single iOS or Android device for privacy, communication management, and
  boundary-setting. Burner supports voice calls, SMS and MMS over VoIP/PSTN, with
  spam blocking, voicemail transcription, auto-reply and multi-line management. For
  developers, Burner exposes an OAuth 2.0 REST API (api.burnerapp.com) for
  programmatic line management and messaging, a webhook system for real-time event
  notifications, and the open-source Burner App Starter Kit (BASK) for building
  Burner-integrated apps and bots such as Hostbot and Ghostbot.
